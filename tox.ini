[tox]
envlist =
    py310
    py310-sphinx-version-smoke
    py311
    py312
    py313
    py314
    linkcheck

[testenv]
description = test environment
runner = uv-venv-lock-runner
dependency_groups = dev
setenv =
    py310: HTTPDOMAIN_WHEEL_SMOKE=1
commands =
    # test html output
    sphinx-build -W -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html
    pytest

[testenv:linkcheck]
description = linkcheck
base_python = py314
commands =
    # check links
    sphinx-build -W -b linkcheck -d {envtmpdir}/doctrees docs {envtmpdir}/linkcheck

[testenv:py310-sphinx-version-smoke]
description = minimal Sphinx 8.1.3 compatibility smoke test
base_python = py310
dependency_groups =
deps =
    sphinx==8.1.3
commands =
    python tests/sphinx_version_smoke.py
